<!DOCTYPE html>
<!-- 
  =========================================
  作者：周飞
  描述：纯内网离线单文件点名器
  日期：2026-07-16
  =========================================
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内网离线点名器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            text-align: center;
        }
        h1 { color: #1e3c72; margin-bottom: 20px; font-size: 28px; }
        .display-area {
            font-size: 72px;
            font-weight: bold;
            color: #d32f2f;
            height: 120px;
            line-height: 120px;
            margin: 20px 0;
            background: #f5f5f5;
            border-radius: 12px;
            border: 3px solid #1e3c72;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: all 0.1s;
        }
        .controls { margin: 20px 0; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            font-weight: bold;
        }
        button:active { transform: scale(0.95); }
        .btn-start { background-color: #4caf50; color: white; }
        .btn-start:hover { background-color: #45a049; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4); }
        .btn-stop { background-color: #f44336; color: white; display: none; }
        .btn-stop:hover { background-color: #d32f2f; box-shadow: 0 4px 10px rgba(244, 67, 54, 0.4); }
        .btn-reset { background-color: #9e9e9e; color: white; }
        .btn-reset:hover { background-color: #757575; }
        
        .settings {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            text-align: left;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 250px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .panel h3 { margin-bottom: 10px; color: #555; font-size: 16px; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
        }
        .history-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            padding-left: 10px;
        }
        .history-list li {
            padding: 5px 0;
            border-bottom: 1px dashed #ddd;
            color: #555;
        }
        .history-list li:before {
            content: "✓ ";
            color: #4caf50;
            font-weight: bold;
        }
        .checkbox-group { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-group label { cursor: pointer; font-size: 14px; color: #555; }
        .stats { margin-top: 10px; font-size: 13px; color: #777; }

        /* 底部作者署名样式 */
        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
        .footer strong {
            color: #1e3c72;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 内网离线点名器</h1>
        
        <div class="display-area" id="display">准备就绪</div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="toggleRoll()">开始点名</button>
            <button class="btn-stop" id="stopBtn" onclick="toggleRoll()">停止</button>
            <button class="btn-reset" onclick="resetAll()">重置所有</button>
        </div>

        <div class="settings">
            <div class="panel">
                <h3>📝 名单设置 (每行一个名字)</h3>
                <textarea id="nameList" placeholder="张三&#10;李四&#10;王五&#10;赵六">张三
李四
王五
赵六
钱七
孙八
周九
吴十</textarea>
                <div class="stats" id="stats">当前名单共 8 人</div>
                <div class="checkbox-group">
                    <input type="checkbox" id="noRepeat" checked>
                    <label for="noRepeat">已点过的人不再重复抽取</label>
                </div>
            </div>
            
            <div class="panel">
                <h3>📜 已点名单记录</h3>
                <ul class="history-list" id="historyList">
                    <li style="color: #999; border: none;">暂无记录</li>
                </ul>
                <button class="btn-reset" style="margin-top: 10px; width: 100%; font-size: 14px; padding: 8px;" onclick="clearHistory()">清空记录</button>
            </div>
        </div>

        <!-- 👇 底部作者署名区域 👇 -->
        <div class="footer">
            <p>本工具由 <strong>庆安电子周飞</strong> 制作 | 纯内网离线版 | <span id="currentDate"></span></p>
        </div>
    </div>

    <script>
        let timer = null;
        let isRolling = false;
        let history = [];
        
        const display = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const nameListArea = document.getElementById('nameList');
        const stats = document.getElementById('stats');
        const historyList = document.getElementById('historyList');
        const noRepeatCheckbox = document.getElementById('noRepeat');
        const currentDateSpan = document.getElementById('currentDate');

        // 初始化当前日期
        const today = new Date();
        currentDateSpan.textContent = today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

        nameListArea.addEventListener('input', updateStats);

        function getNames() {
            return nameListArea.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
        }

        function updateStats() {
            const names = getNames();
            stats.textContent = `当前名单共 ${names.length} 人`;
        }

        function toggleRoll() {
            if (isRolling) {
                stopRoll();
            } else {
                startRoll();
            }
        }

        function startRoll() {
            const names = getNames();
            if (names.length === 0) {
                alert('请先在名单中输入名字！');
                return;
            }

            const noRepeat = noRepeatCheckbox.checked;
            let availableNames = names;
            
            if (noRepeat) {
                availableNames = names.filter(n => !history.includes(n));
                if (availableNames.length === 0) {
                    alert('所有人均已被点过！请勾选“清空记录”或取消“不重复抽取”选项。');
                    return;
                }
            }

            isRolling = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            nameListArea.disabled = true;

            timer = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * availableNames.length);
                display.textContent = availableNames[randomIndex];
            }, 50);
        }

        function stopRoll() {
            clearInterval(timer);
            isRolling = false;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            nameListArea.disabled = false;

            const finalName = display.textContent;
            
            if (!history.includes(finalName)) {
                history.push(finalName);
                updateHistoryUI();
            }
            
            display.style.transform = "scale(1.1)";
            display.style.color = "#d32f2f";
            setTimeout(() => {
                display.style.transform = "scale(1)";
            }, 200);
        }

        function updateHistoryUI() {
            if (history.length === 0) {
                historyList.innerHTML = '<li style="color: #999; border: none;">暂无记录</li>';
                return;
            }
            historyList.innerHTML = history.map((name, index) => 
                `<li>${index + 1}. ${name}</li>`
            ).join('');
            historyList.scrollTop = historyList.scrollHeight;
        }

        function clearHistory() {
            if (confirm('确定要清空已点名单记录吗？')) {
                history = [];
                updateHistoryUI();
            }
        }

        function resetAll() {
            if (confirm('确定要重置所有状态吗？（将清空历史记录并停止当前滚动）')) {
                clearInterval(timer);
                isRolling = false;
                startBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
                nameListArea.disabled = false;
                display.textContent = '准备就绪';
                display.style.color = '#d32f2f';
                history = [];
                updateHistoryUI();
            }
        }

        // 初始化统计
        updateStats();
    </script>
</body>
</html>
